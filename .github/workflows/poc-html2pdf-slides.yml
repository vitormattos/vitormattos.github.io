name: POC Slides PDF renderer

on:
  push:
    branches:
      - poc/html2pdf-slides
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install POC dependencies
        run: npm install --no-save puppeteer@24.7.2 pdf-lib@1.17.1

      - name: Export one Slides.com deck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start=$(date +%s)
          node scripts/poc-slides-pdf.mjs \
            'https://slides.com/vitormattos/quem-controla-sua-tecnologia-controla-seu-futuro/embed' \
            artifacts/quem-controla-sua-tecnologia-focused.pdf
          end=$(date +%s)
          elapsed=$((end - start))
          bytes=$(stat -c '%s' artifacts/quem-controla-sua-tecnologia-focused.pdf)
          printf 'elapsed_seconds=%s\n' "$elapsed" | tee artifacts/benchmark.txt
          printf 'pdf_bytes=%s\n' "$bytes" | tee -a artifacts/benchmark.txt

      - name: Upload POC result
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf-focused-poc
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
