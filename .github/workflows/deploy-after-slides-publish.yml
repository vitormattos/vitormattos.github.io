name: Deploy after Slides.com publishing

on:
  workflow_run:
    workflows:
      - Publish Slides.com PDFs
    types:
      - completed

permissions:
  actions: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
