name: Preview Build

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Configure preview base URL
        run: |
          PREVIEW_URL="https://vitormattos.github.io/site-preview/pr-preview/pr-${{ github.event.pull_request.number }}"
          sed -i "s|https://vitormattos.github.io|${PREVIEW_URL}|g" config.production.php
      - name: Build preview
        run: composer build
      - name: Test preview build
        run: composer test
      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-build
          path: build_production/
          retention-days: 1
