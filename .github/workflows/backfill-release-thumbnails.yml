name: Backfill release thumbnails

on:
  push:
    branches:
      - temp/slideshare-pdf-backfill
    paths:
      - '.github/workflows/backfill-release-thumbnails.yml'
  workflow_run:
    workflows:
      - Publish Slides.com PDFs
      - Publish SlideShare archive
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-thumbnail-backfill
  cancel-in-progress: true

jobs:
  backfill:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Generate missing release thumbnails
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/backfill-release-thumbnails.php
