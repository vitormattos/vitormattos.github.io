name: Sync SlideShare release assets

on:
  push:
    branches:
      - fix/slideshare-release-assets
    paths:
      - 'scripts/sync-slideshare-release-assets.php'
      - '.github/workflows/sync-slideshare-release-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slideshare-release-assets-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Synchronize release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/sync-slideshare-release-assets.php

      - name: Commit synchronized talk assets
        run: |
          set -euo pipefail
          git add source/_talks source/_talksEn
          if git diff --cached --quiet; then
            echo 'SlideShare release assets are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: synchronize SlideShare release assets'
          git push origin HEAD:fix/slideshare-release-assets
