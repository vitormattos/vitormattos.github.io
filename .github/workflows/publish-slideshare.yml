name: Publish SlideShare archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slideshare-archive-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install presentation conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-impress

      - name: Restore SlideShare asset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/slideshare
          key: slideshare-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            slideshare-v1-${{ runner.os }}-

      - name: Publish SlideShare archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/publish-slideshare.php

      - name: Commit synchronized SlideShare metadata
        shell: bash
        run: |
          set -euo pipefail
          git add presentations/slideshare source/_talks source/_talksEn

          if git diff --cached --quiet; then
            echo 'SlideShare archive is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: synchronize SlideShare archive metadata'
          git pull --rebase origin main
          git push origin HEAD:main
