name: Publish SlideShare archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-slideshare-pdf-backfill
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Restore SlideShare session
        env:
          SLIDESHARE_STORAGE_STATE: ${{ secrets.SLIDESHARE_STORAGE_STATE }}
        run: |
          test -n "$SLIDESHARE_STORAGE_STATE" || { echo 'SLIDESHARE_STORAGE_STATE secret is required.' >&2; exit 1; }
          printf '%s' "$SLIDESHARE_STORAGE_STATE" > "$RUNNER_TEMP/slideshare-storage-state.json"

      - name: Download and publish SlideShare PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          SLIDESHARE_STORAGE_STATE_PATH: ${{ runner.temp }}/slideshare-storage-state.json
        run: node scripts/slideshare-download-pdfs.mjs
