name: Normalize Slides bootstrap archive

on:
  push:
    branches:
      - automation/slides-com-sync

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/slides-com-sync
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Normalize archived presentation payload
        run: php scripts/tmp-normalize-slides-bootstrap.php

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git add presentations/slides.com source/_talks source/_talksEn
          if git diff --cached --quiet; then
            echo 'Archive already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: normalize archived Slides.com source'
          git push origin HEAD:automation/slides-com-sync
