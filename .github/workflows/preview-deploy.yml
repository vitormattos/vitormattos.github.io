name: Deploy PR previews

on:
  workflow_run:
    workflows: ["Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

env:
  PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}

jobs:
  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Extract PR number
        id: pr
        run: |
          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Download preview artifact
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-build
          path: build_production/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy preview
        if: steps.pr.outputs.number != '' && env.PREVIEW_TOKEN != ''
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          action: deploy
          source-dir: ./build_production/
          pr-number: ${{ steps.pr.outputs.number }}
          pages-base-url: vitormattos.github.io/site-preview
          deploy-repository: vitormattos/site-preview
          preview-branch: main
          wait-for-pages-deployment: false
          token: ${{ secrets.PREVIEW_TOKEN }}
      - name: Preview deployment not configured
        if: steps.pr.outputs.number != '' && env.PREVIEW_TOKEN == ''
        run: echo 'Preview artifact built successfully; deployment is disabled until PREVIEW_TOKEN is configured.'
