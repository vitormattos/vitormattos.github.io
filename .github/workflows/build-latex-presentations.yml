name: Build LaTeX presentations

on:
  push:
    branches: [main]
    paths:
      - 'presentations/latex/**'
      - 'scripts/build-latex-presentations.php'
      - 'scripts/publish-latex-presentations.php'
      - 'src/Presentations/LatexPresentation.php'
      - 'tests/Presentations/LatexPresentationTest.php'
      - '.github/workflows/build-latex-presentations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latex-presentations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name == 'push' }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install project dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install cached TeX Live
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          texlive_version: 2026
          packages: |
            scheme-basic
            latex
            latex-bin
            latexmk
            beamer
            babel-portuges
            hyphen-portuguese
            lm
            microtype
            xcolor
            pgf
            hyperref

      - name: Ensure PDF rendering tools
        shell: bash
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: Test LaTeX publication policy
        run: vendor/bin/phpunit tests/Presentations/LatexPresentationTest.php

      - name: Build presentation PDFs and thumbnails
        run: php scripts/build-latex-presentations.php

      - name: Validate generated files
        run: |
          test -s source/presentations/latex/open-source-ecosystem-review/open-source-ecosystem-review.pdf
          test -s source/presentations/latex/open-source-ecosystem-review/thumbnail.png
          test -s source/presentations/latex/open-source-ecosystem-review/metadata.json
          pdfinfo source/presentations/latex/open-source-ecosystem-review/open-source-ecosystem-review.pdf | grep -q '^Pages:'

      - name: Upload generated presentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: latex-presentations
          path: |
            source/presentations/latex/**/*.pdf
            source/presentations/latex/**/thumbnail.png
            source/presentations/latex/**/metadata.json
          if-no-files-found: error

      - name: Publish GitHub releases and synchronize release manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/publish-latex-presentations.php

      - name: Commit synchronized release manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add presentations/latex/*/export.json

          if git diff --cached --quiet; then
            echo 'LaTeX release manifests are already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: synchronize LaTeX presentation release assets'
          git pull --rebase origin main
          git push origin HEAD:main
