name: Publish Slides.com PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'presentations/slides.com/**'
      - 'scripts/generate-slides-pdfs.php'
      - 'scripts/slides/decktape-reveal.js'
      - 'src/Presentations/PdfExportPolicy.php'
  workflow_run:
    workflows:
      - Sync Slides.com
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slides-com-pdf-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm install --no-save --package-lock=false decktape@3.16.1
          cp scripts/slides/decktape-reveal.js node_modules/decktape/plugins/reveal.js

      - name: Restore presentation PDF cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/slides-pdf
          key: slides-pdf-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            slides-pdf-v2-${{ runner.os }}-

      - name: Publish archival PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/generate-slides-pdfs.php

      - name: Commit release manifests
        shell: bash
        run: |
          set -euo pipefail
          git add presentations/slides.com/*/export.json

          if git diff --cached --quiet; then
            echo 'Release manifests are already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: update presentation PDF release manifests'
          git pull --rebase origin main
          git push origin HEAD:main
