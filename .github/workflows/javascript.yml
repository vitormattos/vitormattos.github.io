name: JavaScript checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: javascript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript formatting
        run: |
          npx prettier --write "source/_assets/js/**/*.js" "tests-js/**/*.js"
          if ! git diff --quiet -- source/_assets/js tests-js; then
            echo "JavaScript files are not canonically formatted. Apply the diff below:"
            git diff -- source/_assets/js tests-js
            exit 1
          fi
      - run: npm run test:js
