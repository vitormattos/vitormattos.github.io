name: Sync Slides.com

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: slides-com-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test presentation contracts
        run: vendor/bin/phpunit tests/Presentations

      - name: Synchronize public decks
        env:
          SLIDES_API_TOKEN: ${{ secrets.SLIDES_API_TOKEN }}
        run: php scripts/sync-slides.php

      - name: Commit synchronized archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/_talks source/_talksEn presentations/slides.com

          if git diff --cached --quiet; then
            echo 'Slides.com archive is already synchronized.'
            exit 0
          fi

          git commit -m 'content: synchronize public Slides.com decks'
          git pull --rebase origin main
          git push origin HEAD:main
