name: Sync Slides.com

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: slides-com-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test presentation contracts
        run: vendor/bin/phpunit tests/Presentations

      - name: Synchronize public decks
        env:
          SLIDES_API_TOKEN: ${{ secrets.SLIDES_API_TOKEN }}
        run: php scripts/sync-slides.php

      - name: Generate archival PDFs
        run: php scripts/generate-slides-pdfs.php

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update synchronization branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='automation/slides-com-sync'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add source/_talks source/_talksEn presentations/slides.com
          git commit -m 'content: synchronize public Slides.com decks'
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'content: synchronize public Slides.com decks' \
              --body 'Automated synchronization of public presentation metadata, archival HTML/CSS and locally generated PDF exports.'
          fi
