name: Generate Composer lock

on:
  push:
    branches:
      - chore/version-composer-lock
    paths:
      - 'composer.json'
      - '.github/workflows/generate-composer-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - name: Generate lock file
        run: composer update --no-interaction --no-progress --prefer-dist --no-install
      - name: Commit lock file
        run: |
          git add composer.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: version Composer lock file'
          git push origin HEAD:chore/version-composer-lock
