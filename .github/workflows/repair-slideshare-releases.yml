name: Repair SlideShare releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slideshare-release-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install thumbnail rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Backfill missing SlideShare thumbnails
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREFIX: slideshare-
        run: php scripts/backfill-release-thumbnails.php

      - name: Refresh SlideShare release descriptions and managed talk assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/sync-slideshare-release-assets.php

      - name: Commit synchronized managed talk metadata
        shell: bash
        run: |
          set -euo pipefail
          git add source/_talks source/_talksEn

          if git diff --cached --quiet; then
            echo 'Managed SlideShare talk metadata is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: refresh SlideShare release assets'
          git pull --rebase origin main
          git push origin HEAD:main
