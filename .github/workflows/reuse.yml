name: REUSE

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v5
